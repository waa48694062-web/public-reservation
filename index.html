<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>公共施設予約</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
    font-family:sans-serif;
    max-width:500px;
    margin:30px auto;
    padding:20px;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

input,textarea{
    width:100%;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:30px;
    padding:14px;
    font-size:18px;
    cursor:pointer;
}

#loading{

    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:12px;
    border-radius:6px;
    margin-bottom:20px;

}

</style>

</head>

<body>

<div id="loading">

LINEと接続しています...

</div>

<h2>公共施設予約</h2>

<label>お名前</label>
<input id="name">

<label>電話番号</label>
<input id="tel">

<label>利用日</label>
<input type="date" id="date">

<label>利用時間</label>
<input id="time">

<label>利用目的</label>
<textarea id="purpose"></textarea>

<button onclick="save()">
予約する
</button>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzzrnXQYZzwGXYAtw6vL_Az80oVtLbdgTHYQI2ZDLJ3TYJYG5yI_y_Q0VfSMTgYaJqVKw/exec";

const LIFF_ID =
"2010895948-lvy0bgTt";

let profile=null;

async function init(){

    try{

        await liff.init({

            liffId:LIFF_ID

        });

        if(!liff.isLoggedIn()){

            liff.login();

            return;

        }

        profile=await liff.getProfile();

        document.getElementById("loading").innerHTML=
        "こんにちは <b>"+profile.displayName+"</b> さん";

        document.getElementById("name").value=
        profile.displayName;

    }

    catch(err){

        document.getElementById("loading").innerHTML=
        "LIFFエラー<br>"+err;

        console.error(err);

    }

}

window.onload=init;

function save(){

    if(profile==null){

        alert("LINEの読み込みが終わっていません");

        return;

    }

    const data={

        displayName:profile.displayName,

        userId:profile.userId,

        tel:document.getElementById("tel").value,

        date:document.getElementById("date").value,

        time:document.getElementById("time").value,

        purpose:document.getElementById("purpose").value

    };
    fetch(GAS_URL,{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(data)

    })

    .then(res=>res.json())

    .then(result=>{

        if(result.success){

            alert(

                "予約が完了しました！\n\n予約番号：" +

                result.reservationNo

            );

            if(liff.isInClient()){

                liff.closeWindow();

            }

        }

        else{

            alert(

                "エラー\n\n"+

                result.error

            );

        }

    })

    .catch(err=>{

        console.error(err);

        alert(

            "通信エラー\n\n"+err

        );

    });

}

</script>

</body>

</html>
