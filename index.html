<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>公共施設予約</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
    font-family:sans-serif;
    max-width:500px;
    margin:30px auto;
    padding:20px;
}

h2{
    text-align:center;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

input,textarea{
    width:100%;
    padding:10px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    margin-top:30px;
    padding:14px;
    font-size:18px;
    cursor:pointer;
}

#loading{

    background:#fff3cd;
    border:1px solid #ffeeba;
    padding:12px;
    border-radius:6px;
    margin-bottom:20px;

}

</style>

</head>

<body>

<div id="loading">

LINEと接続しています...

</div>

<h2>公共施設予約</h2>

<label>担当者名 *</label>
<input id="name">

<label>使用日 *</label>
<input type="date" id="date">

<label>施設の対象地区 *</label>
<input id="area" placeholder="例：世田谷区">

<label>施設名 *</label>
<input id="facility" placeholder="例：○○区民センター">

<label>部屋名 *</label>
<input id="room" placeholder="例：音楽室">

<label>時間区分 *</label>
<input id="time" placeholder="例：午前,午後1,午後2">

<label>利用目的 *</label>
<textarea
id="purpose"
placeholder="使用楽器を明記してください"
></textarea>

<label>利用人数（概算） *</label>
<input
type="number"
id="people"
placeholder="例：10人程度">

<label>備考など</label>
<textarea
id="memo"
placeholder="連絡事項などあれば入力してください"
></textarea>

<button onclick="save()">
予約する
</button>

<script>

const GAS_URL =
"https://script.google.com/macros/s/AKfycbzzrnXQYZzwGXYAtw6vL_Az80oVtLbdgTHYQI2ZDLJ3TYJYG5yI_y_Q0VfSMTgYaJqVKw/exec";

const LIFF_ID =
"2010895948-lvy0bgTt";

let profile = null;

async function init(){

    try{

        await liff.init({
            liffId:LIFF_ID
        });

        if(!liff.isLoggedIn()){
            liff.login();
            return;
        }

        profile = await liff.getProfile();

        document.getElementById("loading").innerHTML =
        "こんにちは <b>"+profile.displayName+"</b> さん";

        document.getElementById("name").value =
        profile.displayName;

    }

    catch(err){

        document.getElementById("loading").innerHTML =
        "LIFFエラー<br>"+err;

        console.error(err);

    }

}

window.onload = init;
    
function save(){

    if(profile == null){

        alert("LINEの読み込みが終わっていません");
        return;

    }

    const data = {

        displayName : profile.displayName,
        userId      : profile.userId,

        date        : document.getElementById("date").value,
        area        : document.getElementById("area").value,
        facility    : document.getElementById("facility").value,
        room        : document.getElementById("room").value,
        time        : document.getElementById("time").value,
        purpose     : document.getElementById("purpose").value,
        people      : document.getElementById("people").value,
        memo        : document.getElementById("memo").value

    };

    // 必須チェック
    if(
        data.date == "" ||
        data.area == "" ||
        data.facility == "" ||
        data.room == "" ||
        data.time == "" ||
        data.purpose == "" ||
        data.people == ""
    ){

        alert("必須項目を入力してください。");
        return;

    }

    fetch(GAS_URL,{

        method:"POST",
        body:JSON.stringify(data)

    })

    .then(res=>res.json())

    .then(result=>{

        if(result.success){

            alert(
                "予約が完了しました！\n\n予約番号：" +
                result.reservationNo
            );

            if(liff.isInClient()){
                liff.closeWindow();
            }

        }

        else{

            alert(
                "エラー\n\n" +
                result.error
            );

        }

    })

    .catch(err=>{

        console.error(err);

        alert(
            "通信エラー\n\n" + err
        );

    });

}

</script>

</body>

</html>
